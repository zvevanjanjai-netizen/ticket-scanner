<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Event Ticket Scanner
  </title>

  <script
    src="https://unpkg.com/html5-qrcode">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 5px 20px
        rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .status {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .invalid {
      color: red;
    }

    .details {
      text-align: left;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.8;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .small {
      color: #666;
      font-size: 13px;
      margin-top: 12px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>
      TICKET SCANNER
    </h1>

    <div id="reader"></div>

    <div id="result">

      <div class="small">
        Point the camera
        at a ticket QR code.
      </div>

    </div>

  </div>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzN3orFF4Rt50ACViw4rHaArj-NDP1DeL0tc3Ba6vzcKxQJv_d-dqFHJUEFe0ylCtyrFw/exec";

let scanner;

let scanningLocked =
  false;


function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );

  Html5Qrcode
    .getCameras()
    .then(cameras => {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        showError(
          "No camera found."
        );

        return;
      }

      let cameraId =
        cameras[0].id;

      if (
        cameras.length > 1
      ) {

        cameraId =
          cameras[
            cameras.length - 1
          ].id;
      }

      scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess,

        function() {}

      );

    })

    .catch(err => {

      showError(
        "Camera access failed: " +
        err
      );

    });
}


function onScanSuccess(
  decodedText
) {

  if (
    scanningLocked
  ) {
    return;
  }

  scanningLocked =
    true;

  const token =
    decodedText.trim();

  try {

    scanner.pause(true);

  } catch (e) {}


  window.location.href =
    APPS_SCRIPT_URL +
    "?page=verify&ticket=" +
    encodeURIComponent(
      token
    );
}


function showError(
  message
) {

  document
    .getElementById(
      "result"
    )
    .innerHTML = `

    <div class="status invalid">
      ERROR
    </div>

    <div class="details">
      ${message}
    </div>

    <button
      onclick="location.reload()">

      TRY AGAIN

    </button>

  `;
}


startScanner();

</script>

</body>

</html>
